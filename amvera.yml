meta:
  version: 1.0
  name: review-intelligence
  platform: Python

build:
  python_version: 3.12
  requirements: requirements.txt
  system_packages:
    - libnss3
    - libatk-bridge2.0-0
    - libdrm2
    - libxkbcommon0
    - libgbm1
    - libasound2
    - libxshmfence1
    - libnspr4
    - libx11-xcb1
    - libxcomposite1
    - libxcursor1
    - libxdamage1
    - libxi6
    - libxtst6
    - libxrandr2
    - libglib2.0-0
    - libgtk-3-0
    - libnotify4
    - libxss1
    - fonts-liberation
  commands:
    - playwright install chromium
    - playwright install-deps

run:
  command: uvicorn main:app --host 0.0.0.0 --port 80
  persistent_storage:
    - /data

env:
  - name: GIGA_AUTH
    value: "MDE5ZGE5OTEtMjUzZS03NmNlLThiZTctNWVhZGQwZTViNTJlOjFlNTY4NjNjLTM0MmUtNGVkOC1iNTg2LTE5OWI3YmU3MTg2Nw=="
  - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
    value: "0"  # 0 значит установить браузер
